name: Build Platform Binaries

on:
  release:
    types: [published]

concurrency:
  group: release-binaries
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - name: linux-x64-musl
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
          - name: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
          - name: linux-armv7
            target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
          - name: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - name: macos-x64
            target: x86_64-apple-darwin
            runner: macos-13
            archive: tar.gz
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - name: windows-arm64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - name: freebsd-x64
            target: x86_64-unknown-freebsd
            runner: ubuntu-latest
            archive: tar.gz
            cross: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cross-compilation target
        if: "!matrix.cross"
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          BINARY="target/${{ matrix.target }}/release/dakera-mcp"
          ARCHIVE="dakera-mcp-${{ matrix.name }}.tar.gz"
          mkdir -p dist
          cp "$BINARY" dist/dakera-mcp
          cp LICENSE README.md dist/ 2>/dev/null || true
          tar -czf "$ARCHIVE" -C dist .
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"
        shell: bash

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          $binary = "target/${{ matrix.target }}/release/dakera-mcp.exe"
          $archive = "dakera-mcp-${{ matrix.name }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $binary dist/dakera-mcp.exe
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/ }
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          Compress-Archive -Path dist/* -DestinationPath $archive
          echo "ASSET=$archive" | Out-File -Append -FilePath $env:GITHUB_ENV
        shell: pwsh

      - name: Generate checksum
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            sha256sum "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"
          else
            shasum -a 256 "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"
          fi
        shell: bash

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.ASSET }}" \
            "${{ env.ASSET }}.sha256" \
            --clobber
        shell: bash

  checksums:
    name: Aggregate Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all checksum files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            -R "${{ github.repository }}" \
            -p "*.sha256" \
            -D checksums/

      - name: Create combined checksums file
        run: |
          cat checksums/*.sha256 | sort > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Upload combined checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            SHA256SUMS.txt \
            --clobber
