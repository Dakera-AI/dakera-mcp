name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2
          shared-key: check
      - name: Purge stale build artifacts
        run: rm -rf target/
      - run: cargo check --all-targets

  clippy:
    name: Clippy
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2
          shared-key: clippy
      - name: Purge stale build artifacts
        run: rm -rf target/
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2
          shared-key: test
      - name: Purge stale build artifacts
        run: rm -rf target/
      - run: cargo test --all-targets

  integration-test:
    name: Integration Tests
    needs: [check, clippy, fmt, test]
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2
          shared-key: integration
      - name: Purge stale build artifacts
        run: rm -rf target/
      - name: Log in to GHCR
        # The self-hosted ARM runner can accumulate a stale GHCR credential in its
        # docker config; once expired, docker presents the bad token instead of doing
        # an anonymous pull of the (public) dakera image and the registry returns
        # `denied: denied`. An explicit login refreshes the credential with a valid
        # token each run, matching the pattern in release.yml. (DAK-6561)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull dakera image
        run: docker pull ghcr.io/dakera-ai/dakera:latest
      - name: Start dakera container
        run: |
          docker run -d \
            --name dakera-integration-${{ github.run_id }} \
            -p 3388:3000 \
            -e DAKERA_ROOT_API_KEY=integration-test-key \
            ghcr.io/dakera-ai/dakera:latest
      - name: Wait for dakera health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3388/health/ready; then
              echo "Dakera healthy"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 3s..."
            sleep 3
          done
          echo "Dakera failed to become healthy"
          docker logs dakera-integration-${{ github.run_id }}
          exit 1
      - name: Run integration tests
        env:
          DAKERA_URL: http://localhost:3388
          DAKERA_API_KEY: integration-test-key
        run: cargo test --features integration -- --test-threads=1 --nocapture
      - name: Stop and remove dakera container
        if: always()
        run: docker rm -f dakera-integration-${{ github.run_id }} || true
