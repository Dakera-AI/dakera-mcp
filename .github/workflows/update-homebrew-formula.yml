name: Update Homebrew Formula

# Runs after the Release workflow completes — waits for all platform tarballs
# to be uploaded to the GitHub Release before computing SHA256 checksums.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

concurrency:
  group: update-homebrew-formula
  cancel-in-progress: false

jobs:
  update-formula:
    name: Update dakera-mcp Homebrew formula
    # Single-line expression avoids YAML block-scalar if: edge cases.
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from release tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download macOS and Linux tarballs and compute SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            gh release download "${TAG}" \
              --pattern "dakera-mcp-${target}.tar.gz" \
              --repo dakera-ai/dakera-mcp \
              --output "dakera-mcp-${target}.tar.gz"
            SHA=$(sha256sum "dakera-mcp-${target}.tar.gz" | awk '{print $1}')
            # Fix: ${target//-/_} replaces all dashes with underscores (no trailing slash)
            echo "SHA256_${target//-/_}=${SHA}" >> "$GITHUB_ENV"
            echo "${target}: ${SHA}"
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: dakera-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Regenerate formula with updated SHA256s
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python3 scripts/update-homebrew-formula.py homebrew-tap/Formula/dakera-mcp.rb

      - name: Commit and push formula update
        run: |
          cd homebrew-tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dakera-mcp.rb
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: update dakera-mcp formula to v${{ steps.version.outputs.VERSION }}"
          git push
          echo "Updated dakera-mcp formula to v${{ steps.version.outputs.VERSION }}"
