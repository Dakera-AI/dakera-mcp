name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.11.53). Required for manual dispatch — tag triggers use the tag ref automatically."
        required: false
        type: string

jobs:
  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update server.json version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"
          cat server.json

      - name: Install mcp-publisher
        run: |
          MCP_VERSION="1.7.9"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_VERSION}/mcp-publisher_${MCP_VERSION}_${OS}_${ARCH}.tar.gz"
          echo "Downloading mcp-publisher v${MCP_VERSION} from ${URL}"
          curl -sSL "$URL" | tar xz -C /usr/local/bin mcp-publisher
          chmod +x /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Publish to MCP Registry
        env:
          REGISTRY_URL: https://registry.modelcontextprotocol.io
        run: |
          mcp-publisher login github-oidc --registry="$REGISTRY_URL"
          mcp-publisher publish --registry="$REGISTRY_URL" server.json
          echo "Published dakera-mcp version ${{ steps.version.outputs.version }}"
