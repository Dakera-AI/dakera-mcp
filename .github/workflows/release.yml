name: Publish Docker Image

on:
  release:
    types: [published]

concurrency:
  group: release-docker
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dakera-ai/dakera-mcp

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty || echo "⚠️ Publish failed (may already exist)"

  # ---------------------------------------------------------------------------
  # Multi-arch Docker build: amd64 on GitHub-hosted, arm64 on native self-hosted
  # Push per-platform tagged images, then merge into multi-arch manifest.
  # Uses tagged images instead of push-by-digest — self-hosted ARM runners
  # have unreliable digest availability in GHCR.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

  # ---------------------------------------------------------------------------
  # Merge per-platform tagged images into a multi-arch manifest
  # ---------------------------------------------------------------------------
  docker-merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Creating multi-arch manifest from:"
          echo "  ${IMAGE}:${VERSION}-amd64"
          echo "  ${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-binary:
    name: Deploy Native Binary
    runs-on: ubuntu-latest
    needs: docker-merge
    continue-on-error: true
    permissions:
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary from Docker image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          docker pull "$IMAGE"
          CONTAINER=$(docker create "$IMAGE")
          docker cp "${CONTAINER}:/usr/local/bin/dakera-mcp" ./dakera-mcp
          docker rm "$CONTAINER"
          echo "Extracted: $(ls -lh ./dakera-mcp)"

      - name: Upload binary to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dakera-mcp"
          target: "/tmp/"

      - name: Install binary on server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            chmod +x /tmp/dakera-mcp
            mv /tmp/dakera-mcp /home/dakera/.local/bin/dakera-mcp
            echo "✅ dakera-mcp ${{ github.ref_name }} deployed"

  release-asset:
    name: Upload Release Binary Asset
    runs-on: ubuntu-latest
    needs: docker-merge
    permissions:
      contents: write
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary from Docker image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          docker pull "$IMAGE"
          CONTAINER=$(docker create "$IMAGE")
          docker cp "${CONTAINER}:/usr/local/bin/dakera-mcp" ./dakera-mcp-linux-x86_64
          docker rm "$CONTAINER"
          chmod +x ./dakera-mcp-linux-x86_64
          tar czf dakera-mcp-linux-x86_64.tar.gz dakera-mcp-linux-x86_64
          sha256sum dakera-mcp-linux-x86_64.tar.gz dakera-mcp-linux-x86_64 > checksums-linux-x86_64.txt
          echo "Extracted: $(ls -lh ./dakera-mcp-linux-x86_64)"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dakera-mcp-linux-x86_64 \
            dakera-mcp-linux-x86_64.tar.gz \
            checksums-linux-x86_64.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
