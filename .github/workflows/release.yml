name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-docker
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dakera-ai/dakera-mcp

jobs:
  # ---------------------------------------------------------------------------
  # Native binary cross-compilation for all target platforms
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-14
            use_zigbuild: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild == true
        run: |
          python3 -m pip install --break-system-packages ziglang
          cargo install cargo-zigbuild
          rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --locked

      - name: Build (zigbuild)
        if: matrix.use_zigbuild == true
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.use_zigbuild != true && matrix.use_cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/dakera-mcp dist/
          TARBALL="dakera-mcp-${{ matrix.target }}.tar.gz"
          tar czf "$TARBALL" -C dist dakera-mcp
          # sha256sum exists on Linux; macOS runners use shasum -a 256
          if command -v sha256sum &>/dev/null; then
            sha256sum "$TARBALL" > "$TARBALL.sha256"
          else
            shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          fi
          echo "Packaged: $(ls -lh $TARBALL)"

      - uses: actions/upload-artifact@v7
        with:
          name: dakera-mcp-${{ matrix.target }}
          path: |
            dakera-mcp-${{ matrix.target }}.tar.gz
            dakera-mcp-${{ matrix.target }}.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # Upload all native binaries to the GitHub Release with combined checksums
  # ---------------------------------------------------------------------------
  upload-release-assets:
    name: Upload Release Assets
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dakera-mcp-*
          merge-multiple: true

      - name: Create combined checksums file
        run: |
          cat *.sha256 > checksums.txt
          echo "=== checksums.txt ==="
          cat checksums.txt

      - name: Upload tarballs and checksums to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dakera-mcp-x86_64-unknown-linux-gnu.tar.gz \
            dakera-mcp-aarch64-apple-darwin.tar.gz \
            dakera-mcp-x86_64-apple-darwin.tar.gz \
            dakera-mcp-aarch64-unknown-linux-gnu.tar.gz \
            checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty || echo "⚠️ Publish failed (may already exist)"

  # ---------------------------------------------------------------------------
  # Multi-arch Docker build: amd64 on GitHub-hosted, arm64 on native self-hosted
  # Push per-platform tagged images, then merge into multi-arch manifest.
  # Uses tagged images instead of push-by-digest — self-hosted ARM runners
  # have unreliable digest availability in GHCR.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

  # ---------------------------------------------------------------------------
  # Merge per-platform tagged images into a multi-arch manifest
  # ---------------------------------------------------------------------------
  docker-merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Creating multi-arch manifest from:"
          echo "  ${IMAGE}:${VERSION}-amd64"
          echo "  ${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-binary:
    name: Deploy Native Binary
    runs-on: ubuntu-latest
    needs: docker-merge
    continue-on-error: true
    permissions:
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary from Docker image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          docker pull "$IMAGE"
          CONTAINER=$(docker create "$IMAGE")
          docker cp "${CONTAINER}:/usr/local/bin/dakera-mcp" ./dakera-mcp
          docker rm "$CONTAINER"
          echo "Extracted: $(ls -lh ./dakera-mcp)"

      - name: Upload binary to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dakera-mcp"
          target: "/tmp/"

      - name: Install binary on server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            chmod +x /tmp/dakera-mcp
            mv /tmp/dakera-mcp /home/dakera/.local/bin/dakera-mcp
            echo "✅ dakera-mcp ${{ github.ref_name }} deployed"

