[package]
name = "dakera-mcp"
version = "0.10.3"
edition = "2021"
license = "MIT"
description = "Dakera MCP Server - Model Context Protocol server for AI agent memory"
repository = "https://github.com/Dakera-AI/dakera-mcp"
homepage = "https://dakera.ai"
documentation = "https://dakera.ai/docs"
readme = "README.md"
authors = ["Dakera AI <hello@dakera.ai>"]
keywords = ["mcp", "ai-memory", "agent-memory", "vector-search", "knowledge-graph"]
categories = ["database", "web-programming"]

[lib]
name = "dakera_mcp"
path = "src/lib.rs"

[[bin]]
name = "dakera-mcp"
path = "src/main.rs"

[features]
integration = []

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for calling Dakera API
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL encoding for path parameters
urlencoding = "2"

# TODO: Update to published crate version: dakera-common = "0.2.0"
# common = { path = "../common" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
